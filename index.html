<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Verifier | Gemini + Todoist</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 1.5rem;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
    }
    h1 { font-size: 1.4rem; color: var(--accent); margin-bottom: 0.25rem; }
    h2 { font-size: 1.1rem; margin-bottom: 0.5rem; }
    p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.4; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; margin-top: 0.8rem; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0b1120;
      color: var(--text);
      font-size: 0.9rem;
    }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1.2rem;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 1rem;
      width: 100%;
    }
    button.secondary {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      margin-top: 0.5rem;
    }
    button.refresh-btn {
      background: #334155;
      color: var(--text);
      margin-top: 0;
      width: auto;
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .task-item {
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .task-content {
      font-size: 0.95rem;
      font-weight: 500;
    }
    .task-badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      margin-left: 0.5rem;
    }
    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 0.5rem;
    }
    .status-badge.connected { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .status-badge.missing { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Focus Verifier</h1>
      <p>Verify task proof via Gemini and auto-complete in Todoist.</p>
    </div>

    <!-- Active Tasks Dashboard -->
    <div class="card" id="tasks-section" style="display: none;">
      <div class="card-header">
        <h2>Active Focus Tasks</h2>
        <button class="refresh-btn" onclick="fetchFocusTasks()">↻ Refresh</button>
      </div>
      <div id="tasks-container" class="task-list">
        <p>Loading tasks...</p>
      </div>
    </div>

    <!-- API Key Setup -->
    <div class="card" id="key-section">
      <h2>API Key Setup (Saved Locally)</h2>
      <p>Keys are stored exclusively in your browser's local memory and sent directly to Google and Todoist.</p>
      
      <label for="gemini-key">Gemini API Key</label>
      <input type="password" id="gemini-key" placeholder="AIzaSy..." />

      <label for="todoist-token">Todoist API Token</label>
      <input type="password" id="todoist-token" placeholder="Your Personal API Token" />

      <button id="save-btn" onclick="handleSaveKeys()">Save Credentials</button>
      <button class="secondary" id="clear-btn" onclick="handleClearKeys()" style="display:none;">Clear All Keys</button>
      
      <div id="status-indicator"></div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
